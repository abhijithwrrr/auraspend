# Project-wide Gradle settings.

# AndroidX
android.useAndroidX=true
# No legacy support-library dependencies remain — disabling Jetifier removes
# a full bytecode-transform pass from every build.
android.enableJetifier=false

# ─── Performance tuning ──────────────────────────────────────────────────────
# Daemon heap sized for R8 full mode + Kotlin compilation of this project.
org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -XX:G1PeriodicGCInterval=5000 -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Separate, smaller heap for the Kotlin daemon (compiler runs in its own process).
kotlin.daemon.jvmargs=-Xmx3g

# Build modules in parallel.
org.gradle.parallel=true

# Reuse task outputs across builds and CI runs.
org.gradle.caching=true

# Cache the configuration phase (AGP 9 is configuration-cache compatible).
org.gradle.configuration-cache=true

# Fail fast on dependency resolution issues instead of silently degrading.
org.gradle.warning.mode=all

# Non-transitive R classes: faster resource processing, smaller incremental builds.
android.nonTransitiveRClass=true

# KSP (2.2.10-2.0.2) still registers its generated sources through the legacy
# kotlin.sourceSets DSL, which built-in Kotlin disallows (google/ksp#2729).
# Sanctioned workaround until KSP ships an android.sourceSets-based registration.
android.disallowKotlinSourceSets=false

# Kotlin incremental compilation per module.
kotlin.incremental=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
