name: PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'build.gradle.kts'
      - 'app/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/pr_check.yml'
      - 'app/src/test/**'
      - 'app/src/main/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-
            ${{ runner.os }}-

      # Previously this workflow only ran two assemble tasks. It never ran the
      # unit tests, never ran lint, and never built :benchmark — so the
      # screenshot baselines, the baseline profile and the test suite could all
      # break without a single red build.

      - name: Unit tests (prod debug)
        run: ./gradlew testProdDebugUnitTest

      - name: Lint (dev debug)
        run: ./gradlew :app:lintDevDebug

      - name: Lint (prod debug)
        run: ./gradlew :app:lintProdDebug

      - name: Build dev flavor
        run: ./gradlew assembleDevDebug

      - name: Build prod flavor
        run: ./gradlew assembleProdDebug

      # Compiles the Macrobenchmark module and the R8-minified release variant,
      # which is what actually consumes app/src/main/baseline-prof.txt. Without
      # this, profile drift is invisible until someone runs it by hand.
      - name: Build benchmark variant + module
        run: ./gradlew :app:assembleProdRelease :benchmark:assemble

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
