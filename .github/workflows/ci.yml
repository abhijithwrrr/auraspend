name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-
            ${{ runner.os }}-

      - name: Accept SDK licenses & install platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew testProdDebugUnitTest

      # Cheap, and it is the only thing standing between a relicensing mistake
      # and a shipped APK that misstates its own licence. It has already caught
      # one: the licence had silently drifted across eleven files.
      - name: Verify licence metadata and third-party attributions
        run: ./tools/check_license.sh

      - name: Verify Aurora screenshots
        run: |
          changes=$(git status --porcelain -- app/src/test/screenshots)
          if [ -n "$changes" ]; then
            echo "::error::Aurora screenshots changed. Review app/src/test/screenshots and commit the new baselines if the UI change is intentional."
            echo "$changes"
            exit 1
          fi

      - name: Upload Aurora screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-screenshots
          path: app/src/test/screenshots/
          if-no-files-found: ignore

      - name: Build dev flavor (debug)
        run: ./gradlew assembleDevDebug

      - name: Build prod flavor (debug)
        run: ./gradlew assembleProdDebug

      - name: Build prod release (full R8)
        run: ./gradlew assembleProdRelease
