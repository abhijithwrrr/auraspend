name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-
            ${{ runner.os }}-

      - name: Accept SDK licenses & install platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew testFreeDebugUnitTest

      - name: Upload Aurora screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      - name: Build free flavor (debug)
        run: ./gradlew assembleFreeDebug

      - name: Build play flavor (debug)
        run: ./gradlew assemblePlayDebug

      - name: Build free release (full R8)
        run: ./gradlew assembleFreeRelease
